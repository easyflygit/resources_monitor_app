name: Python application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04  # Используем последнюю версию Ubuntu

    steps:
    # Проверка репозитория и клонирование кода
    - name: Checkout code
      uses: actions/checkout@v2

    # Установка Python
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    # Установка зависимостей
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: resources_monitor_app

    # Запуск тестов
    - name: Run tests
      run: |
        python -m unittest tests.py
      working-directory: resources_monitor_app